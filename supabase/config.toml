# Local development configuration for the Supabase CLI.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
#
# `project_id` names the local Docker stack only. The production project this
# repo deploys to is selected in CI by the SUPABASE_PROJECT_REF secret.
project_id = "sylos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false

# The Plaid edge function. verify_jwt means the platform rejects requests
# without a valid user JWT before our code runs — the function itself then
# resolves the caller's profile through RLS.
[functions.plaid]
verify_jwt = true

# The Google Calendar edge function. verify_jwt is OFF because Google's OAuth
# redirect (GET /gcal/callback) and the pg_cron sync poke (POST /gcal/sync-due)
# arrive with no user JWT; the per-user POST routes resolve the caller's
# profile through the Authorization header + RLS themselves, the callback
# authenticates by its one-time state row, and sync-due is cooldown-guarded
# (see notes/06-integrations.md).
[functions.gcal]
verify_jwt = false

# The push delivery function. verify_jwt is OFF because the push_queue
# trigger's and the push-send cron's pokes (POST /push/send-due) arrive with
# no user JWT; send-due only delivers rows already queued, and the per-user
# routes (/status, /test) resolve the caller through the Authorization
# header + RLS themselves (see notes/06-integrations.md).
[functions.push]
verify_jwt = false

# The following relay: Syla reaches a friend's database through her own
# project (POST /following-relay), so her sessions need no network
# allowance per friend and the friend's token never leaves the vault's
# side of the wall. verify_jwt is OFF because the gate is the
# x-claude-rq-key header, checked in SQL (following_relay_target), the
# same gate every agent write path has (see skills/following).
[functions.following-relay]
verify_jwt = false

# The one-tap-setup token relay — DEVELOPER infrastructure, deployed only
# on the Sylos developer's own project (never on a user's; without its
# secrets it answers 500). verify_jwt is OFF because it serves the app
# before any user project or session exists; an authorization code is
# single-use and PKCE-bound, so the relay grants nothing by itself
# (see notes/08-provisioning.md).
[functions.supabase-oauth]
verify_jwt = false

# The push relay — DEVELOPER infrastructure like supabase-oauth: it holds
# the app's APNs signing key, which is bound to the bundle id and must
# never reach a user's project (owners can read their own secrets) or the
# app binary. Each install's push function hands it the final signed hop.
# verify_jwt is OFF because installs share no secret to gate it with; the
# pinned apns-topic bounds what it can do (see notes/06-integrations.md).
[functions.push-relay]
verify_jwt = false
